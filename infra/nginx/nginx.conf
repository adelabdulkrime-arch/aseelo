upstream aseelo_backend {
    server backend:8000;
}

upstream aseelo_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Uploads can be large; keep in sync with MAX_UPLOAD_SIZE.
    client_max_body_size 512m;

    # Long renders are handled by Celery, but keep generous timeouts for uploads.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://aseelo_backend;
        # Video downloads are streamed; buffering them would hold a whole file
        # in nginx before a single byte reaches the user.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /media/ {
        proxy_pass http://aseelo_backend;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Carries the API origin for this deployment — must never be cached.
    location = /runtime-config.js {
        proxy_pass http://aseelo_frontend;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /health {
        proxy_pass http://aseelo_backend;
    }

    location / {
        proxy_pass http://aseelo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

